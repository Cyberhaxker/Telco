telco:
  target: "{{ env_var('DBT_TARGET', 'dw') }}"
  outputs:
    dw:
      type: postgres
      host: "{{ env_var('DW_HOST', 'dw-postgres') }}"
      port: "{{ env_var('DW_PORT', '5432') | as_number }}"
      user: "{{ env_var('DW_OWNER_USER', 'dw_owner') }}"
      password: "{{ env_var('DW_OWNER_PASSWORD') }}"
      dbname: "{{ env_var('DW_DB', 'telco_churn_dw') }}"
      schema: marts
      threads: 4
      connect_timeout: 10
      retries: 3
      keepalives_idle: 30
