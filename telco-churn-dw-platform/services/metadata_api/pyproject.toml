[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-api"
version = "1.0.0"
description = "Data dictionary, dataset registry, lineage, data quality and pipeline status for the Telco platform"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "telco-common",
  "uvicorn[standard]>=0.32,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["metadata_api*"]
