[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-api"
version = "1.0.0"
description = "OLAP, KPI, prediction and model endpoints for the Telco platform"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "telco-common",
  "telco-ml",
  "uvicorn[standard]>=0.32,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "redis>=5.2,<9",
  "aiokafka[lz4]>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["analytics_api*"]
