[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-consumer"
version = "1.0.0"
description = "Consumes validated ingest events from Kafka into the PostgreSQL raw schema"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "telco-common",
  "aiokafka[lz4]>=0.12,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "prometheus-client>=0.21,<1",
]

[tool.setuptools.packages.find]
include = ["stream_consumer*"]
