[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion-api"
version = "1.0.0"
description = "Data entry, batch validation and Kafka publishing for the Telco platform"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "telco-common",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.14,<2",
  "pymysql>=1.1,<2",
  "cryptography>=44",
  "confluent-kafka>=2.6,<3",
  "python-multipart>=0.0.20",
]

[tool.setuptools.packages.find]
include = ["ingestion_api*"]
