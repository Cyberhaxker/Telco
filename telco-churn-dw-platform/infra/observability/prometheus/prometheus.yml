global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs: [{ targets: ["apisix:9091"] }]
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-api:8000", "metadata-api:8000", "analytics-api:8000"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
  - job_name: stream-consumer
    static_configs: [{ targets: ["stream-consumer:8001"], labels: { service: stream-consumer } }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: mysql
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: airflow
    static_configs: [{ targets: ["statsd-exporter:9102"] }]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{ targets: ["keycloak:9000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
