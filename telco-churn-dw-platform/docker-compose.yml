# Telco Churn Analytics Platform - development stack.
#
#   make up        -> every profile (core + airflow + ml + observability)
#   make up-core   -> core only (databases, kafka, keycloak, gateway, APIs, PWA)
#
# Only the gateway, the PWA, Keycloak and the admin UIs are published on the
# host. Databases are published for local tooling; in docker-compose.prod.yml
# those mappings are removed.

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-py-service: &py-service
  restart: unless-stopped
  logging: *default-logging
  networks: [backend]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

x-oidc-env: &oidc-env
  OIDC_ISSUER: ${PUBLIC_KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
  OIDC_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
  OIDC_AUDIENCE: telco-api
  LOG_LEVEL: ${LOG_LEVEL}
  ENVIRONMENT: ${ENVIRONMENT}
  CORS_ORIGINS: ${PUBLIC_WEB_URL}

x-airflow: &airflow
  build:
    context: .
    dockerfile: orchestration/airflow/Dockerfile
  image: telco/airflow:${IMAGE_TAG:-dev}
  profiles: [airflow]
  restart: unless-stopped
  logging: *default-logging
  networks: [backend]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${PLATFORM_DB_PASSWORD}@platform-db:5432/airflow
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    AIRFLOW__LOGGING__LOGGING_LEVEL: ${LOG_LEVEL}
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    # Connections are supplied as environment variables, never stored in DAG code.
    AIRFLOW_CONN_OPS_MYSQL: mysql://ops_extract:${OPS_EXTRACT_PASSWORD}@mysql:3306/${OPS_DB}
    AIRFLOW_CONN_OPS_MYSQL_RW: mysql://ops_app:${OPS_APP_PASSWORD}@mysql:3306/${OPS_DB}
    AIRFLOW_CONN_DW_POSTGRES: postgresql://dw_owner:${DW_OWNER_PASSWORD}@dw-postgres:5432/${DW_DB}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    DBT_PROFILES_DIR: /opt/airflow/dbt_telco
    DBT_PROJECT_DIR: /opt/airflow/dbt_telco
    DBT_TARGET_PATH: /opt/airflow/dbt_artifacts/target
    DW_HOST: dw-postgres
    DW_PORT: "5432"
    DW_DB: ${DW_DB}
    DW_OWNER_PASSWORD: ${DW_OWNER_PASSWORD}
    DW_ML_PASSWORD: ${DW_ML_PASSWORD}
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    ML_MODEL_NAME: ${ML_MODEL_NAME}
    ML_CHAMPION_METRIC: ${ML_CHAMPION_METRIC}
    ML_MIN_ROC_AUC: ${ML_MIN_ROC_AUC}
    ML_HIGH_RISK_THRESHOLD: ${ML_HIGH_RISK_THRESHOLD}
    ML_MODEL_DIR: /models
    SEED_CSV_PATH: /opt/airflow/data/raw/Telco-Customer-Churn.csv
    ALERT_WEBHOOK_URL: ${AIRFLOW_ALERT_WEBHOOK_URL}
    ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL}
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags:ro
    - ./data/raw:/opt/airflow/data/raw:ro
    - airflow-logs:/opt/airflow/logs
    - dbt-artifacts:/opt/airflow/dbt_artifacts
    - ml-models:/models
  depends_on:
    platform-db: { condition: service_healthy }

services:
  # ======================================================================
  # Data stores
  # ======================================================================
  dw-postgres:
    build: { context: ., dockerfile: infra/db/postgres/Dockerfile }
    image: telco/dw-postgres:${IMAGE_TAG:-dev}
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    environment:
      POSTGRES_DB: ${DW_DB}
      POSTGRES_USER: ${DW_SUPERUSER}
      POSTGRES_PASSWORD: ${DW_SUPERUSER_PASSWORD}
      DW_OWNER_PASSWORD: ${DW_OWNER_PASSWORD}
      DW_INGEST_PASSWORD: ${DW_INGEST_PASSWORD}
      DW_ANALYTICS_PASSWORD: ${DW_ANALYTICS_PASSWORD}
      DW_META_PASSWORD: ${DW_META_PASSWORD}
      DW_ML_PASSWORD: ${DW_ML_PASSWORD}
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: [dw-data:/var/lib/postgresql]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && test -f /var/lib/postgresql/.telco_init_done"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  platform-db:
    image: postgres:18.6
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
    volumes:
      - platform-db-data:/var/lib/postgresql
      - ./infra/db/platform/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OPS_DB}
      OPS_APP_PASSWORD: ${OPS_APP_PASSWORD}
      OPS_EXTRACT_PASSWORD: ${OPS_EXTRACT_PASSWORD}
    ports: ["${MYSQL_PORT}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/db/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./infra/db/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  valkey:
    image: valkey/valkey:8.1.10-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $${VALKEY_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  # ======================================================================
  # Messaging
  # ======================================================================
  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["${KAFKA_PORT}:9094"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.2.2
    networks: [backend]
    depends_on: { kafka: { condition: service_healthy } }
    environment:
      BOOTSTRAP: kafka:9092
      REPLICATION_FACTOR: "1"
    volumes: [./infra/kafka/create-topics.sh:/create-topics.sh:ro]
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  # ======================================================================
  # Identity and gateway
  # ======================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    command: ["start-dev", "--import-realm", "--health-enabled=true", "--metrics-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://platform-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -Xms128m -Xmx512m
      # Placeholders consumed by infra/keycloak/realm-telco.json
      KC_REALM: ${KEYCLOAK_REALM}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      KC_PWA_CLIENT_ID: ${KEYCLOAK_PWA_CLIENT_ID}
      KC_GATEWAY_CLIENT_ID: ${KEYCLOAK_GATEWAY_CLIENT_ID}
      KC_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    ports: ["${KEYCLOAK_PORT}:8080"]
    volumes: [./infra/keycloak/realm-telco.json:/opt/keycloak/data/import/realm-telco.json:ro]
    depends_on: { platform-db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 40s

  apisix:
    image: apache/apisix:3.19.0-debian
    restart: unless-stopped
    logging: *default-logging
    networks: [backend, edge]
    entrypoint: ["/bin/bash", "/usr/local/apisix/conf/telco/render-and-start.sh"]
    environment:
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      KEYCLOAK_GATEWAY_CLIENT_ID: ${KEYCLOAK_GATEWAY_CLIENT_ID}
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET}
    ports: ["${APISIX_PORT}:9080"]
    volumes: [./infra/apisix:/usr/local/apisix/conf/telco:ro]
    depends_on:
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ======================================================================
  # Application services
  # ======================================================================
  ingestion-api:
    <<: *py-service
    build: { context: ., dockerfile: services/ingestion_api/Dockerfile }
    image: telco/ingestion-api:${IMAGE_TAG:-dev}
    environment:
      <<: *oidc-env
      SERVICE_NAME: ingestion-api
      OPS_DATABASE_URL: mysql+pymysql://ops_app:${OPS_APP_PASSWORD}@mysql:3306/${OPS_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck: &py-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  stream-consumer:
    <<: *py-service
    build: { context: ., dockerfile: services/stream_consumer/Dockerfile }
    image: telco/stream-consumer:${IMAGE_TAG:-dev}
    environment:
      SERVICE_NAME: stream-consumer
      LOG_LEVEL: ${LOG_LEVEL}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DW_DSN: postgresql://dw_ingest:${DW_INGEST_PASSWORD}@dw-postgres:5432/${DW_DB}
    depends_on:
      dw-postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *py-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=4).status == 200 else 1)"]

  metadata-api:
    <<: *py-service
    build: { context: ., dockerfile: services/metadata_api/Dockerfile }
    image: telco/metadata-api:${IMAGE_TAG:-dev}
    environment:
      <<: *oidc-env
      SERVICE_NAME: metadata-api
      DW_DSN: postgresql://dw_meta:${DW_META_PASSWORD}@dw-postgres:5432/${DW_DB}
      DBT_MANIFEST_PATH: /dbt_artifacts/target/manifest.json
      AIRFLOW_API_URL: http://airflow-apiserver:8080
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes: [dbt-artifacts:/dbt_artifacts:ro]
    depends_on:
      dw-postgres: { condition: service_healthy }
    healthcheck: *py-health

  analytics-api:
    <<: *py-service
    build: { context: ., dockerfile: services/analytics_api/Dockerfile }
    image: telco/analytics-api:${IMAGE_TAG:-dev}
    environment:
      <<: *oidc-env
      SERVICE_NAME: analytics-api
      DW_DSN: postgresql://dw_analytics:${DW_ANALYTICS_PASSWORD}@dw-postgres:5432/${DW_DB}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      ML_MODEL_NAME: ${ML_MODEL_NAME}
      ML_MODEL_DIR: /models
      ML_HIGH_RISK_THRESHOLD: ${ML_HIGH_RISK_THRESHOLD}
    volumes: [ml-models:/models:ro]
    depends_on:
      dw-postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck: *py-health

  # One-shot: build staging -> marts -> olap with dbt as soon as the warehouse
  # is up, so the platform is usable even before Airflow has run.
  dbt-bootstrap:
    build: { context: ., dockerfile: transform/dbt_telco/Dockerfile }
    image: telco/dbt:${IMAGE_TAG:-dev}
    networks: [backend]
    restart: "no"
    environment:
      DW_HOST: dw-postgres
      DW_PORT: "5432"
      DW_DB: ${DW_DB}
      DW_OWNER_PASSWORD: ${DW_OWNER_PASSWORD}
      DBT_TARGET_PATH: /dbt_artifacts/target
    volumes: [dbt-artifacts:/dbt_artifacts]
    command: ["bash", "-c", "dbt seed && dbt build && dbt docs generate"]
    depends_on:
      dw-postgres: { condition: service_healthy }

  # ======================================================================
  # PWA (static export served by NGINX, /api proxied to APISIX)
  # ======================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: telco/web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    environment:
      PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_PWA_CLIENT_ID: ${KEYCLOAK_PWA_CLIENT_ID}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      GATEWAY_UPSTREAM: apisix:9080
    ports: ["${WEB_PORT}:8080"]
    depends_on: [apisix]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ======================================================================
  # Orchestration (profile: airflow)
  # ======================================================================
  airflow-init:
    <<: *airflow
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/airflow/scripts/airflow-init.sh"]
    user: "0:0"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports: ["${AIRFLOW_PORT}:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
      dw-postgres: { condition: service_healthy }

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-triggerer:
    <<: *airflow
    command: triggerer
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  # Seeds MySQL from the CSV and triggers the first warehouse run.
  airflow-bootstrap:
    <<: *airflow
    restart: "no"
    command: ["bash", "/opt/airflow/scripts/bootstrap-dags.sh"]
    entrypoint: []
    depends_on:
      airflow-scheduler: { condition: service_started }
      airflow-apiserver: { condition: service_healthy }
      ingestion-api: { condition: service_healthy }

  # ======================================================================
  # Machine learning (profile: ml)
  # ======================================================================
  mlflow:
    build: { context: ., dockerfile: ml/mlflow.Dockerfile }
    image: telco/mlflow:${IMAGE_TAG:-dev}
    profiles: [ml, airflow]
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${PLATFORM_DB_PASSWORD}@platform-db:5432/mlflow
    ports: ["${MLFLOW_PORT}:5000"]
    volumes: [mlflow-artifacts:/mlartifacts]
    depends_on: { platform-db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-shot: train, register, promote and score (Airflow does this weekly/daily afterwards).
  ml-train:
    build: { context: ., dockerfile: ml/Dockerfile }
    image: telco/ml:${IMAGE_TAG:-dev}
    profiles: [ml]
    networks: [backend]
    restart: "no"
    environment:
      DW_DSN: postgresql://dw_ml:${DW_ML_PASSWORD}@dw-postgres:5432/${DW_DB}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      ML_MODEL_NAME: ${ML_MODEL_NAME}
      ML_CHAMPION_METRIC: ${ML_CHAMPION_METRIC}
      ML_MIN_ROC_AUC: ${ML_MIN_ROC_AUC}
      ML_HIGH_RISK_THRESHOLD: ${ML_HIGH_RISK_THRESHOLD}
      ML_MODEL_DIR: /models
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes: [ml-models:/models]
    command: ["bash", "-c", "python -m telco_ml.train && python -m telco_ml.score"]
    depends_on:
      dbt-bootstrap: { condition: service_completed_successfully }
      mlflow: { condition: service_healthy }

  # ======================================================================
  # Observability (profile: observability)
  # ======================================================================
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [observability]
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d", "--web.enable-lifecycle"]
    ports: ["${PROMETHEUS_PORT}:9090"]
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:13.0.2
    profiles: [observability]
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      DW_ANALYTICS_PASSWORD: ${DW_ANALYTICS_PASSWORD}
      DW_DB: ${DW_DB}
    ports: ["${GRAFANA_PORT}:3000"]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [observability]
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    profiles: [observability]
    restart: unless-stopped
    networks: [backend]
    environment:
      DATA_SOURCE_NAME: postgresql://dw_analytics:${DW_ANALYTICS_PASSWORD}@dw-postgres:5432/${DW_DB}?sslmode=disable

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    profiles: [observability]
    restart: unless-stopped
    networks: [backend]
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=ops_extract"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${OPS_EXTRACT_PASSWORD}

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    profiles: [observability]
    restart: unless-stopped
    networks: [backend]
    command: ["--kafka.server=kafka:9092"]
    depends_on: { kafka: { condition: service_healthy } }

  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    profiles: [observability, airflow]
    restart: unless-stopped
    networks: [backend]

networks:
  backend: {}
  edge: {}

volumes:
  dw-data: {}
  platform-db-data: {}
  mysql-data: {}
  kafka-data: {}
  airflow-logs: {}
  dbt-artifacts: {}
  ml-models: {}
  mlflow-artifacts: {}
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
